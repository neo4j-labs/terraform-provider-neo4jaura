    description: |
      Add TestAcc_instance_update covering an in-place name or memory change across two steps.
      Add TestAcc_instance_disappears that creates the instance, deletes it out-of-band via the
      mock server, and verifies the next apply proposes recreation rather than erroring (depends
      on task-001 landing first). Add a testAccPreCheck helper and wire PreCheck into every
      resource.TestCase. Add a testAccCheckInstanceDestroyed CheckDestroy function and wire it
      into every applicable TestCase. Add a changelog entry.
    status: pending
    dependencies:
      - task-001
    acceptance_criteria:
      - "TestAcc_instance_update exists, runs two steps, and passes with the mock server"
      - "TestAcc_instance_disappears exists and verifies recreation is planned after out-of-band deletion"
      - "Every resource.TestCase in the test suite has a PreCheck field calling testAccPreCheck(t)"
      - "Every applicable resource.TestCase has a CheckDestroy field"
      - "All mock-acceptance tests pass"
      - "Changelog entry present under .changes/unreleased/"
    completed_at: null

