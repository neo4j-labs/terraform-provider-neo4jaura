name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.0.3-beta)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Install changie
        run: go install github.com/miniscruff/changie@latest

      - name: Batch unreleased changes
        run: changie batch "${{ inputs.version }}"

      - name: Merge changelog
        run: changie merge

      - name: Create branch, commit, open PR, and push tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          BRANCH="chore/release-v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add .changes/ CHANGELOG.md
          git commit -m "chore: prepare release v${VERSION}"
          git push origin "${BRANCH}"

          # Tag from the release branch commit — triggers release.yml immediately.
          # The PR below brings CHANGELOG.md into main after review.
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

          gh pr create \
            --title "chore: prepare release v${VERSION}" \
            --body "$(cat <<EOF
          ## Release v${VERSION}

          Auto-generated by the Prepare Release workflow.

          - Changie entries batched into \`.changes/${VERSION}.md\`
          - \`CHANGELOG.md\` regenerated
          - Tag \`v${VERSION}\` pushed — the Release workflow is already running

          Merge this PR to bring the changelog into \`main\`.
          EOF
          )" \
            --base main \
            --head "${BRANCH}"
