name: Prepare Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'

      - name: Install changie
        run: go install github.com/miniscruff/changie@latest

      - name: Batch unreleased changes
        run: changie batch auto

      - name: Get next version
        id: next_version
        run: echo "version=$(changie latest)" >> $GITHUB_OUTPUT

      - name: Merge changelog
        run: changie merge

      - name: Commit changelog and create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .changes/ CHANGELOG.md
          git commit -m "chore: prepare release ${{ steps.next_version.outputs.version }}"
          git tag "v${{ steps.next_version.outputs.version }}"
          git push origin main
          git push origin "v${{ steps.next_version.outputs.version }}"
